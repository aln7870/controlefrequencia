<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Controle de Frequência{% endblock %}</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1f2937;--mut:#6b7280;--pri:#2563eb;--pri2:#1d4ed8;--ok:#047857;--okbg:#d1fae5;--err:#b91c1c;--errbg:#fee2e2;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#e5e7eb;--mut:#94a3b8;--pri:#3b82f6;--pri2:#60a5fa;--ok:#6ee7b7;--okbg:#064e3b;--err:#fca5a5;--errbg:#7f1d1d;--bd:#334155}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
header .in{max-width:880px;margin:0 auto;padding:.7rem 1rem;display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:center}
header strong{font-size:1.1rem;margin-right:auto}
nav a{color:#fff;text-decoration:none;opacity:.9;padding:.25rem .5rem;border-radius:6px;font-size:.92rem;display:inline-block}
nav a:hover{background:rgba(255,255,255,.18);opacity:1}
main{max-width:880px;margin:1.5rem auto;padding:0 1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1.4rem 1.6rem;margin-bottom:1.2rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{margin:0 0 1rem;font-size:1.6rem}h2{font-size:1.1rem;margin:1.4rem 0 .5rem;color:var(--mut)}
.msg{padding:.7rem 1rem;border-radius:8px;margin-bottom:1rem;font-weight:500}
.ok{background:var(--okbg);color:var(--ok)}.erro{background:var(--errbg);color:var(--err)}
label{display:block;margin:.8rem 0 .2rem;font-weight:600;font-size:.92rem}
input:not([type=radio]),select{width:100%;padding:.55rem .7rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
button{margin-top:1.1rem;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:.6rem 1.3rem;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--pri2)}
ul{list-style:none;margin:0;padding:0}
li{padding:.6rem .2rem;border-bottom:1px solid var(--bd)}li:last-child{border-bottom:0}
a{color:var(--pri)}
.linha{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.2rem;padding:.6rem 0;border-bottom:1px solid var(--bd)}
.linha .nome{flex:1;min-width:150px;font-weight:600}
.linha label{display:inline-flex;align-items:center;gap:.35rem;margin:0;font-weight:400}
.situacao{display:inline-block;padding:.2rem .7rem;border-radius:999px;font-weight:600}
.situacao.regular{background:var(--okbg);color:var(--ok)}
.situacao.em-risco{background:var(--errbg);color:var(--err)}
.login{max-width:400px;margin:3rem auto}
.login h1{text-align:center}.login button{width:100%}
form.inline{display:grid;gap:.2rem}
.vazio{color:var(--mut)}
</style></head>
<body>
<header><div class="in"><strong>📋 Controle de Frequência</strong>
{% if user.is_authenticated %}<nav><a href="/inicio/">Início</a><a href="/alunos/">Alunos</a><a href="/alunos/novo/">Novo aluno</a>
<a href="/turmas/">Turmas</a><a href="/turmas/nova/">Nova turma</a><a href="/frequencia/">Frequência</a>
<a href="/faltas/">Excesso de faltas</a><a href="/sair/">Sair</a></nav>{% endif %}</div></header>
<main>
{% for m in messages %}<div class="msg {% if m.tags == 'error' %}erro{% else %}ok{% endif %}">{{ m }}</div>{% endfor %}
<div class="card {% block classe %}{% endblock %}">
<h1>{% block h1 %}{% endblock %}</h1>
{% block conteudo %}{% endblock %}
</div></main>
</body></html>
